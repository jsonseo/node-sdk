name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 18 — нижняя граница: с неё fetch есть без флагов. Дальше все
        # живые ветки, включая текущую.
        node: ['18', '20', '22', '24', '26']
        os: [ubuntu-latest]
        # Крайние версии гоняем ещё и на других системах: пути, переводы
        # строк и сокеты там ведут себя по-своему.
        include:
          - node: '18'
            os: windows-latest
          - node: '26'
            os: windows-latest
          - node: '26'
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm install

      - run: npm test

      - run: npm run smoke

  bun:
    name: Bun / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      # Сборку делает tsc, а тесты — родной раннер Bun: так проверяется
      # не «пакет ставится», а что все 69 тестов в нём проходят.
      - run: npm install

      - run: npm run build

      - run: bun test test/

      - run: bun scripts/smoke.mjs

  deno:
    name: Deno / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm install

      - run: npm run build

      # --no-check: типы проверяет tsc на сборке, Deno здесь отвечает
      # за поведение в своём рантайме.
      - run: deno test --allow-all --no-check test/client.test.js test/errors.test.js test/package.test.js test/params.test.js test/retry.test.js

      - run: deno run --allow-env scripts/smoke.mjs

  consumer:
    name: Типы у потребителя (TS ${{ matrix.typescript }}, ${{ matrix.resolution }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typescript: ['5', '7']
        resolution: [node16, bundler, node10]
        exclude:
          # node10 убран в TypeScript 7.
          - typescript: '7'
            resolution: node10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install

      # Собранный пакет ставится в чистый проект и типизуется из .cts и
      # .mts: битые типы для require иначе всплыли бы только у клиента.
      - run: npm run build

      - run: node scripts/check-consumer.mjs ${{ matrix.typescript }} ${{ matrix.resolution }}
